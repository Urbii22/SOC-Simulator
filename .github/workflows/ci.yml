name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Emit structured scenario report
        run: ./node_modules/.bin/tsx scripts/validate-scenarios.ts --json > scenario-validation.json
        continue-on-error: true
      - run: npm run check
      - name: Regenerate derived artifacts
        run: |
          npm run generate
          npm run generate:coverage
          git diff --exit-code -- datasets docs/COVERAGE_MATRIX.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-validation
          path: scenario-validation.json
          if-no-files-found: ignore
